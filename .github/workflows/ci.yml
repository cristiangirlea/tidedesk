name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Build release
        run: cargo build --locked --release --workspace
      - name: Verify release packaging
        shell: pwsh
        run: ./tools/test-release.ps1
      - name: Verify MSIX packaging (test identity only)
        shell: pwsh
        run: ./tools/test-msix.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tidedesk-windows-x64
          path: |
            target/release/tidedesk.exe
            target/release/tidedesk-host.exe
            target/release/tidedesk-view.exe

  # The wire format is what the rendezvous service, a Linux program, builds on.
  proto-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked -p tidedesk-rendezvous-proto --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -p tidedesk-rendezvous-proto
