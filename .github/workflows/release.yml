name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - name: Validate release settings
        id: settings
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $settings = ./tools/release-settings.ps1 -Tag $env:RELEASE_TAG
          "version=$($settings.Version)" >> $env:GITHUB_OUTPUT
          "signing=$($settings.Signing)" >> $env:GITHUB_OUTPUT
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit on main.' }
      - uses: ilammy/setup-nasm@e77cc62a22a374a4d0668286007cc3e3b4c17760 # v1
      - name: Check NASM
        run: |
          nasm -v
          if ($LASTEXITCODE -ne 0) { throw 'NASM is required for releases.' }
          if (Test-Path Env:OPENH264_NO_ASM) { throw 'Assembly must be enabled.' }
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Build release
        env:
          TIDEDESK_VERSION: ${{ steps.settings.outputs.version }}
        run: cargo build --locked --release --workspace
      - name: Upload binaries for signing
        if: steps.settings.outputs.signing == 'true'
        id: unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows-x64
          path: |
            target/release/tidedesk-host.exe
            target/release/tidedesk-view.exe
          if-no-files-found: error
          retention-days: 7
      - name: Sign with SignPath
        if: steps.settings.outputs.signing == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/signed
          parameters: |
            version: "${{ steps.settings.outputs.version }}"
      - name: Package and checksum
        env:
          RELEASE_VERSION: ${{ steps.settings.outputs.version }}
          RELEASE_SIGNED: ${{ steps.settings.outputs.signing }}
        run: |
          $signed = $env:RELEASE_SIGNED -eq 'true'
          $binaries = if ($signed) { 'target/signed' } else { 'target/release' }
          ./tools/package-release.ps1 -Version $env:RELEASE_VERSION -BinaryDirectory $binaries -Signed:$signed
      - name: Upload release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-payload
          path: |
            target/dist/*.zip
            target/dist/*.sha256
            target/dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Microsoft Store package
        if: vars.MSIX_ENABLED == 'true'
        env:
          RELEASE_VERSION: ${{ steps.settings.outputs.version }}
          STORE_BUILD_NUMBER: ${{ github.run_number }}
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $settings = @{
            Version = $env:RELEASE_VERSION
            PackageVersion = "1.0.$env:STORE_BUILD_NUMBER.0"
            IdentityName = $env:MSIX_IDENTITY_NAME
            Publisher = $env:MSIX_PUBLISHER
            PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME
          }
          ./tools/package-msix.ps1 @settings
      - name: Upload Store submission candidate (not a public installer)
        if: vars.MSIX_ENABLED == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: microsoft-store-submission
          path: |
            target/store/*.msix
            target/store/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload
          path: dist
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $zip = "dist/tidedesk-$version-windows-x64.zip"
          $args = @('release', 'create', $env:RELEASE_TAG, $zip, "$zip.sha256",
            '--verify-tag', '--title', "TideDesk $version", '--notes-file', 'dist/release-notes.md')
          if ($version.Contains('-')) { $args += '--prerelease' }
          gh @args
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are never overwritten.' }
