[workspace]
resolver = "3"
members = ["crates/tidedesk-core", "crates/tidedesk-host", "crates/tidedesk-view"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Cristian Girlea"]
repository = "https://github.com/cristiangirlea/tidedesk"
rust-version = "1.88"

[workspace.dependencies]
tidedesk-core = { path = "crates/tidedesk-core" }
anyhow = "1"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
cpal = "0.18"
openh264 = "0.9"
opus = "0.4"
postcard = { version = "1.1", features = ["use-std"] }
quinn = "0.11"
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The codecs are unusably slow unoptimised, even while debugging our own code.
[profile.dev.package."*"]
opt-level = 2
