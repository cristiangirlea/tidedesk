[package]
name = "tidedesk-core"
description = "Platform-independent protocol, auth and networking shared by the TideDesk host and viewer."
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
arboard.workspace = true
argon2.workspace = true
postcard.workspace = true
quinn.workspace = true
rcgen.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
spake2.workspace = true
toml = "1"
tidedesk-rendezvous-proto.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Management_MobileDeviceManagementRegistration",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_NetManagement",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
]
