[package]
name = "tidedesk"
description = "TideDesk: remote access to your own Windows computers. Host and viewer in one program."
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "tidedesk_app"
path = "src/lib.rs"

[[bin]]
name = "tidedesk"
path = "src/main.rs"

[dependencies]
tidedesk-core.workspace = true
tidedesk-ui.workspace = true
tidedesk-host.workspace = true
tidedesk-view.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui_software_backend = "0.0.3"

[build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
png = { version = "0.18.1", default-features = false }
