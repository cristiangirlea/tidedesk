[package]
name = "tidedesk-view"
description = "TideDesk viewer: shows and plays a remote host's screen and audio and forwards input."
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tidedesk-core.workspace = true
anyhow.workspace = true
clap.workspace = true
cpal.workspace = true
if-addrs = "0.15"
openh264.workspace = true
opus.workspace = true
quinn.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
softbuffer = "0.4"
winit = "0.30"
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.34", default-features = false, features = ["clipboard"] }
egui_software_backend = "0.0.3"
toml = "1"
serde = { workspace = true, features = ["derive"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"]
