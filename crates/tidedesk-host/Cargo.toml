[package]
name = "tidedesk-host"
description = "TideDesk host: shares this machine's screen and audio and accepts remote input."
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tidedesk-host"
path = "src/main.rs"

[dependencies]
tidedesk-core.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
cpal.workspace = true
openh264.workspace = true
opus.workspace = true
quinn.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
egui = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.34", default-features = false, features = ["clipboard"] }
egui_software_backend = "0.0.3"
if-addrs = "0.15"
tray-icon = "0.25"
toml = "1"
serde = { workspace = true, features = ["derive"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "ApplicationModel",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0.11"
