[package]
name = "tidedesk-android"
description = "The Android viewer's Rust side: the session, called from Kotlin through JNI."
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# cdylib for the app; rlib so the session is tested on any computer.
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
quinn.workspace = true
tidedesk-core.workspace = true
tidedesk-rendezvous-proto.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
